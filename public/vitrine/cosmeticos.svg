    <path d="M6 0 l30 -14 v56 h-30z" fill="#c0392b"/>
    <rect x="0" y="40" width="42" height="34" rx="4" fill="url(#gold)"/>
    <rect x="-4" y="74" width="50" height="76" rx="8" fill="#1f2a44"/>
    <rect x="4" y="82" width="6" height="58" rx="3" fill="#ffffff" opacity="0.2"/>
  </g>
  <!-- pote de creme -->
  <g transform="translate(46 300)">
    <rect x="0" y="0" width="106" height="24" rx="8" fill="#ffffff"/>
    <rect x="6" y="24" width="94" height="62" rx="12" fill="#7a5bd6"/>
    <rect x="14" y="34" width="8" height="42" rx="4" fill="#ffffff" opacity="0.3"/>
    <rect x="30" y="46" width="46" height="16" rx="4" fill="#ffffff" opacity="0.85"/>
  </g>
  <!-- brilhos -->
  <path d="M400 120 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" fill="#ffffff"/>
  <path d="M110 220 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z" fill="#ffffff"/>
