<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ecfb"/>
      <stop offset="1" stop-color="#e6d5f3"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9c9d6"/>
      <stop offset="1" stop-color="#e46a8b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a930"/>
      <stop offset="0.5" stop-color="#f6d77a"/>
      <stop offset="1" stop-color="#c8941f"/>
    </linearGradient>
  </defs>
  <rect width="480" height="480" fill="url(#bg)"/>
  <circle cx="70" cy="80" r="70" fill="#ffffff" opacity="0.4"/>
  <ellipse cx="240" cy="392" rx="190" ry="18" fill="#b79ad0" opacity="0.4"/>
  <!-- perfume -->
  <rect x="200" y="96" width="44" height="34" rx="6" fill="url(#gold)"/>
  <rect x="210" y="130" width="24" height="22" fill="#c8941f"/>
  <rect x="150" y="150" width="144" height="236" rx="30" fill="url(#bottle)"/>
  <rect x="150" y="150" width="144" height="236" rx="30" fill="#ffffff" opacity="0.08"/>
  <rect x="168" y="172" width="16" height="190" rx="8" fill="#ffffff" opacity="0.35"/>
  <rect x="186" y="246" width="72" height="44" rx="6" fill="#ffffff" opacity="0.85"/>
  <rect x="198" y="260" width="48" height="6" rx="3" fill="#b5476a"/>
  <rect x="206" y="272" width="32" height="5" rx="2.5" fill="#d58aa2"/>
